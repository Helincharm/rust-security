[package]
name = "helinity-desktop"
version = "0.1.0"
description = "Helinity local Rust review desktop"
edition = "2021"
publish = false

[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
security-core = { path = "../../../crates/security-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
runtime-analysis = { path = "../../../crates/runtime-analysis" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
